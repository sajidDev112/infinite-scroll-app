# Render Blueprint: one Web Service runs the API and serves both websites.
#   https://<name>.onrender.com/admin/   admin dashboard
#   https://<name>.onrender.com/client/  public client site
#   https://<name>.onrender.com/api/     API (also used by the desktop app)
# Render → New → Blueprint → pick this repository. Values marked sync: false are
# asked for once in the Render dashboard (never commit them).
services:
  - type: web
    name: infinite-scroll-app
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: JWT_REMEMBER_EXPIRES_IN
        value: 30d
      - key: CORS_ORIGINS # your Render address, e.g. https://infinite-scroll-app.onrender.com
        sync: false
      - key: MAX_UPLOAD_MB
        value: 15
      - key: MONGODB_URI # MongoDB Atlas connection string, e.g. mongodb+srv://user:pass@cluster.mongodb.net/infinite_scroll_app
        sync: false
      - key: ADMIN_NAME
        value: Administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
    # Images are stored in MongoDB (GridFS), so no disk is needed.
